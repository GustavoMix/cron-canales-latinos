name: Weekly channel check and JSON publish

on:
  workflow_dispatch:
  schedule:
    # Sunday 08:00 UTC = 04:00 in Bolivia (UTC-4).
    - cron: "0 8 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: channelwatch-pages
  cancel-in-progress: false

jobs:
  test:
    name: Test checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Validate configuration
        run: python -m channelwatch validate-config

  check-country:
    name: Check ${{ matrix.country }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        country:
          - BO
          - AR
          - BR
          - CL
          - PE
          - CO
          - EC
          - PY
          - UY
          - VE
          - MX
          - PA
          - CR
          - GT
          - HN
          - SV
          - NI
          - DO
          - PR
          - ES

    env:
      COUNTRY: ${{ matrix.country }}
      CHANNELWATCH_STATE_DIR: .state/${{ matrix.country }}
      CHANNELWATCH_OUTPUT_DIR: public/data
      # All GitHub Pages project sites for one owner share this browser Origin.
      CHANNELWATCH_WEB_ORIGIN: https://${{ github.repository_owner }}.github.io

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore country health history
        uses: actions/cache@v4
        with:
          path: .state/${{ matrix.country }}
          key: channelwatch-health-${{ matrix.country }}-${{ github.run_id }}
          restore-keys: |
            channelwatch-health-${{ matrix.country }}-

      - name: Restore previous published snapshot
        uses: actions/cache/restore@v4
        with:
          path: .published-snapshot
          key: channelwatch-published-${{ github.run_id }}
          restore-keys: |
            channelwatch-published-

      - name: Install checker
        run: pip install -e .

      - name: Seed previous country JSON for drop protection
        shell: bash
        run: |
          set -euo pipefail
          code_lc="$(printf '%s' "$COUNTRY" | tr '[:upper:]' '[:lower:]')"
          mkdir -p public/data
          if [ -f ".published-snapshot/data/${code_lc}.json" ]; then
            cp ".published-snapshot/data/${code_lc}.json" "public/data/${code_lc}.json"
            echo "Previous ${code_lc}.json restored."
          else
            echo "No previous ${code_lc}.json (normal on first run)."
          fi

      - name: Check one country and publish its JSON
        run: python -m channelwatch run --country "$COUNTRY"

      - name: Prepare country artifact
        shell: bash
        run: |
          set -euo pipefail
          code_lc="$(printf '%s' "$COUNTRY" | tr '[:upper:]' '[:lower:]')"
          mkdir -p country-artifact
          if [ -f "public/data/${code_lc}.json" ]; then
            cp "public/data/${code_lc}.json" country-artifact/
          fi

      - name: Upload country JSON
        uses: actions/upload-artifact@v4
        with:
          name: country-${{ matrix.country }}
          path: country-artifact/*.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Build index and deploy GitHub Pages
    needs: [test, check-country]
    if: ${{ always() && needs.test.result == 'success' && needs.check-country.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install checker
        run: pip install -e .

      - name: Restore previous published snapshot
        uses: actions/cache/restore@v4
        with:
          path: .published-snapshot
          key: channelwatch-published-${{ github.run_id }}
          restore-keys: |
            channelwatch-published-

      - name: Seed complete previous site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          if [ -d .published-snapshot/data ]; then
            cp -a .published-snapshot/data/. public/data/
          fi

      - name: Download successful country artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: country-*
          path: public/data
          merge-multiple: true

      - name: Rebuild countries index
        run: python -m channelwatch publish-index

      - name: Prepare snapshot for next weekly run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .published-snapshot
          mkdir -p .published-snapshot/data
          find public/data -maxdepth 1 -type f -name '*.json' -exec cp {} .published-snapshot/data/ \;

      - name: Save published snapshot
        uses: actions/cache/save@v4
        with:
          path: .published-snapshot
          key: channelwatch-published-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
